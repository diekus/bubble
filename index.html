<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00CDFF">
  <meta name="application-title" content=" ">
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
  <title>bubble</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark.css" rel="stylesheet" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="css/light.css" rel="stylesheet" media="(prefers-color-scheme: light)">
  <link rel="icon" href="images/favicon.png" type="image/x-icon">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
  <div id="wcoTitlebar" aria-hidden="true"></div>
  <header>
    <h1>
        <picture>
          <source srcset="images/icon-192.png" media="(orientation: portrait and max-width: 768px)" />
          <source srcset="images/bubble-logo.png" media="(prefers-color-scheme: light)" />
          <source srcset="images/bubble-logo-dark.png" media="(prefers-color-scheme: dark)" />
          <img src="images/bubble-logo.png" alt="bubble pictures logo" height="50" />
        </picture>
    </h1>
    <label class="file-label pill-button">
      <input type="file" id="fileInput" accept="image/*">
      <span>Select Image</span>
    </label>
    <button type="button" id="galleryButton" class="pill-button gallery-button">Gallery</button>
    <button type="button" id="shareButton" class="icon-button" aria-label="Share this image" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="18" cy="5" r="3"></circle>
        <circle cx="6" cy="12" r="3"></circle>
        <circle cx="18" cy="19" r="3"></circle>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
      </svg>
    </button>
    <p class="menu-hint">Double tap/click to show/hide menu</p>
  </header>
  <main>
    <a-scene embedded>
      <a-sky id="sky" color="white" rotation="0 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 200000"></a-sky>
    </a-scene>
  </main>
  <div id="galleryOverlay" class="gallery-overlay" inert aria-hidden="true">
    <div class="gallery-panel" role="dialog" aria-modal="true" aria-labelledby="galleryTitle">
      <div class="gallery-panel-header">
        <h2 id="galleryTitle">Choose a 360&deg; image</h2>
        <button type="button" id="galleryClose" class="gallery-close" aria-label="Close gallery">&times;</button>
      </div>
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
  </div>
  <script src="gallery-data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
      });
    }
  </script>
</body>
</html>
